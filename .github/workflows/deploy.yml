name: Deploy Astro Portfolio to cPanel shared Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://alexsaballos.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Install Node and Run Build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Sync to cPanel via SFTP
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_CPANEL_PRIVATE_KEY }}
          REMOTE_PORT: ${{ secrets.CPANEL_PORT }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.CPANEL_IP }}
          REMOTE_USER: ${{ secrets.CPANEL_USERNAME }}
          TARGET: "/home/${{ secrets.CPANEL_USERNAME }}/public_html/"