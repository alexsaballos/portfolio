version: 2
updates:
  # Check for npm package updates (Astro, TypeScript, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
    	interval: "weekly"
    open-pull-requests-limit: 5

  # Check for GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
    	interval: "weekly"
    open-pull-requests-limit: 3